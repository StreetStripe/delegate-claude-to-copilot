name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate install script syntax
        run: bash -n install.sh

      - name: Validate required files exist
        run: |
          test -f README.md
          test -f LICENSE
          test -f install.sh
          test -f docs/HOWTO.md
          test -f templates/CLAUDE.md
          test -f templates/bridge/index.js
          test -f templates/bridge/package.json
          test -f templates/skills/copilot/SKILL.md

      - name: Validate internal markdown links
        run: python3 .github/scripts/check_markdown_links.py
